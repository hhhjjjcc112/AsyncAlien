[build]
target = "riscv64gc-unknown-linux-musl"


[profile.release]
lto = true
strip = true
opt-level = 3   # Optimize for size.
panic = "abort"


[target.riscv64gc-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
linker = "riscv64-linux-musl-cc"

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
linker = "x86_64-linux-musl-gcc"