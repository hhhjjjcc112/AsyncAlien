[package]
name = "vfscore-ref"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitflags = "1.3.2"
log = "0.4.14"
downcast-rs = { version = "1.2.0", default-features = false }
pconst = { path = "../../utils/pconst", optional = true }
shared_heap = { path = "../../domain-lib/shared_heap" }

[features]
linux_error = ["dep:pconst"]

[dev-dependencies]
ramfs = { path = "../ramfs-ref", package = "ramfs-ref"}
spin = "0"